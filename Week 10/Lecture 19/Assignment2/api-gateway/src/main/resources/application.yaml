spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: book
          uri: http://localhost:8081/
          predicates:
            - Path=/api/v1/book/**
          filters:
            - name: AuthenticationFilter

        - id: writer
          uri: http://localhost:8082/
          predicates:
            - Path=/api/v1/writer/**
          filters:
            - name: AuthenticationFilter

server:
  port: 8080                