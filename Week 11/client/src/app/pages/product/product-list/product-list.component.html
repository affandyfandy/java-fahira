<div class="container mt-5">
  <h2 class="text-center mb-4">Product List</h2>
  <div class="row">
    <div *ngFor="let product of products; let i = index" class="col-md-4 mb-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="card-text">
            Quantity: {{ product.quantity }}<br>
            Price: {{ product.price | currency:'IDR' }}
          </p>
          <div class="d-flex justify-content-between">
            <button class="btn btn-primary" (click)="showProductDetail(product, i)">
              Detail
            </button>
            <button class="btn btn-success">
              Checkout
            </button>
          </div>
        </div>
      </div>
    </div>

    <app-product-detail
      [currentProduct]="currentProduct"
      [viewMode]="viewMode">
    </app-product-detail>
  </div>
</div>
